name: CI

on:
  push:
  pull_request:

jobs:
  # ── Job 1：測試 backend（需要 postgres）──
  test-backend: # Job名字
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todoapp
        ports:
          - 5432:5432 # runner主機:5432 → postgres容器:5432.    runner: GitHub 給你跑job的那台ubuntu機器
        options: >-  # 傳給 docker run 的額外參數
          --health-cmd "pg_isready -U postgres -d todoapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/todoapp?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test -- --run

  # ── Job 2：測試 frontend（lint + vitest）──
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run

  ## ── Job 3：build 前後端 image（測試都過才跑）──
  ## 這是本地kind的ci，只需要build不需要把image push到雲端
  # build:
  #   runs-on: ubuntu-latest
  #   needs: [test-backend, test-frontend]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: docker/setup-buildx-action@v3
  #     - name: Build backend image
  #       uses: docker/build-push-action@v6
  #       with:
  #         context: ./backend
  #         push: false
  #         tags: cn_practice_todo_backend:ci
  #     - name: Build frontend image
  #       uses: docker/build-push-action@v6
  #       with:
  #         context: ./frontend
  #         push: false
  #         tags: cn_practice_todo_frontend:ci

  ## 這是GCP的ci.yml檔，要把build好的image push到Articraft Registry
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      id-token: write          # ← WIF 必須：讓 Actions 能拿 OIDC token
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/749120191951/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@todo-cloudnative-huan.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            asia-east1-docker.pkg.dev/todo-cloudnative-huan/todo-repo/backend:latest
            asia-east1-docker.pkg.dev/todo-cloudnative-huan/todo-repo/backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            asia-east1-docker.pkg.dev/todo-cloudnative-huan/todo-repo/frontend:latest
            asia-east1-docker.pkg.dev/todo-cloudnative-huan/todo-repo/frontend:${{ github.sha }}