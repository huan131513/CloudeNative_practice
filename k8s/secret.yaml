# 這是一份manifests，負責描述kind叢集內的結構（總共有6份）
# 1	secret.yaml	DB 帳密、DATABASE_URL	backend 要用
# 2	configmap.yaml	非機密設定（FRONTEND_ORIGIN、PORT）	backend 要用
# 3	postgres.yaml	StatefulSet + PVC + headless Service	backend 連它
# 4	backend.yaml	Deployment + Service	frontend/ingress 連它
# 5	frontend.yaml	Deployment + Service	ingress 連它
# 6	ingress.yaml	路由 / 和 /api	最後串起來
apiVersion: v1
kind: Secret
metadata: 
  # 這個 Secret 的名字，之後 backend/postgres 用名字引用這裡寫的資料
  name: todo-secret
# 「一般用途的自訂 key-value」（相對於 TLS 憑證等特殊類型）
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todoapp?schema=public
  # postgresql://postgres:postgres@postgres:5432/todoapp?schema=public
#  └───┬────┘   └──┬───┘ └──┬───┘ └──┬───┘  └┬─┘ └──┬──┘ └─────┬─────┘
#     協定        使用者    密碼    service   port   DB名     查詢參數
